version: "3.9"

# ── InferenceToken full-stack
# Required environment variables (set in .env or your shell):
#   PRIVATE_KEY          Ethereum wallet private key (0x...)
#   RPC_URL              JSON-RPC endpoint (e.g. https://sepolia.base.org)
#   CONTRACT_ADDRESS     Deployed InferenceToken contract address
#   MINER_PRIVATE_KEY    Separate key for the miner (recommended)
#
# Optional:
#   MODELS_DIR           Host path containing GGUF model files (default: ./models)
#   MINER_MAX_JOBS       Max concurrent inference jobs (default: 3)
#   API_PORT             External API port (default: 8000)
#   FRONTEND_PORT        External frontend port (default: 3000)

x-common-env: &common-env
  RPC_URL:          ${RPC_URL}
  CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}

services:

  # ── Miner node ─────────────────────────────────────────────────────────────
  miner:
    build:
      context: ./miner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PRIVATE_KEY:      ${MINER_PRIVATE_KEY:-${PRIVATE_KEY}}
      MODELS_DIR:       /models
      MAX_JOBS:         ${MINER_MAX_JOBS:-3}
      N_GPU_LAYERS:     ${N_GPU_LAYERS:--1}
      N_CTX:            ${N_CTX:-4096}
      LOG_LEVEL:        ${LOG_LEVEL:-INFO}
      ENCRYPTION_ENABLED: "false"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - miner-keys:/root/.inference-miner
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "9090:9090"   # health + Prometheus metrics
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── OpenAI-compatible API server ────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - ./deployment.json:/app/deployment.json:ro
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Static frontend (nginx) ─────────────────────────────────────────────────
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deployment.json:/usr/share/nginx/html/deployment.json:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  # ── Prometheus (optional observability) ────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    profiles: ["observability"]

  # ── Grafana (optional dashboards) ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    profiles: ["observability"]

volumes:
  miner-keys:
  prometheus-data:
  grafana-data:
