<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>InferenceChain — Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>
:root {
  --bg:       #0b0a09;
  --bg-2:     #111009;
  --bg-3:     #181612;
  --bg-4:     #201e19;
  --border:   #252218;
  --border-2: #302c22;
  --ink:      #f0ece5;
  --ink-2:    #b0a898;
  --ink-3:    #6a6055;
  --accent:   #d4712a;
  --accent-2: #e8894a;
  --good:     #4ab87a;
  --warn:     #e8aa4a;
  --bad:      #e05a45;
  --blue:     #5a9cf0;
  --purple:   #a78bfa;
  --mono:     "JetBrains Mono", monospace;
  --sans:     "Inter", -apple-system, sans-serif;
  --serif:    "Instrument Serif", serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;}a:hover{color:var(--accent-2);}
code{font-family:var(--mono);font-size:.9em;}

/* Nav */
.nav{background:var(--bg-2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;padding:0 24px;}
.nav-inner{max-width:1280px;margin:0 auto;height:56px;display:flex;align-items:center;gap:0;}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-right:32px;color:var(--ink);}
.diamond{width:12px;height:12px;background:var(--accent);transform:rotate(45deg);flex-shrink:0;}
.nav-tag{font-family:var(--mono);font-size:9px;color:var(--accent);background:rgba(212,113,42,.12);border:1px solid rgba(212,113,42,.3);padding:2px 7px;border-radius:3px;letter-spacing:.1em;}
.nav-links{display:flex;gap:20px;margin-left:auto;}
.nav-links a{font-size:13px;color:var(--ink-2);font-weight:500;}
.nav-links a:hover{color:var(--accent);}
.nav-links a.active{color:var(--accent);}

/* Layout */
.page{max-width:1280px;margin:0 auto;padding:28px 24px 60px;}

/* Search bar */
.search-bar{display:flex;gap:10px;margin-bottom:28px;}
.search-input{flex:1;background:var(--bg-2);border:1px solid var(--border-2);color:var(--ink);
              font-family:var(--sans);font-size:14px;padding:10px 14px;border-radius:6px;}
.search-input:focus{outline:none;border-color:var(--accent);}
.search-input::placeholder{color:var(--ink-3);}
.search-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;
            padding:10px 20px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.search-btn:hover{background:var(--accent-2);}
.search-btn:disabled{opacity:.5;cursor:default;}
.model-filter{background:var(--bg-2);border:1px solid var(--border-2);color:var(--ink-2);
              font-family:var(--mono);font-size:12px;padding:10px 12px;border-radius:6px;cursor:pointer;min-width:160px;}
.model-filter:focus{outline:none;border-color:var(--accent);}

/* Stats bar */
.stats-bar{display:flex;gap:24px;margin-bottom:24px;flex-wrap:wrap;}
.stat-item{display:flex;flex-direction:column;gap:3px;}
.stat-val{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--ink);}
.stat-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}

/* Thought cards */
.thought-list{display:flex;flex-direction:column;gap:14px;}
.thought-card{background:var(--bg-2);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.thought-card:hover{border-color:var(--border-2);}
.thought-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.thought-model{font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:3px;
               background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.3);
               white-space:nowrap;}
.thought-miner{font-family:var(--mono);font-size:10px;color:var(--ink-3);}
.thought-job{font-family:var(--mono);font-size:10px;color:var(--ink-3);}
.thought-score{font-family:var(--mono);font-size:10px;color:var(--accent);margin-left:auto;}
.thought-body{padding:16px;}
.thought-q{font-size:14px;font-weight:500;color:var(--ink);line-height:1.55;margin-bottom:12px;}
.thought-think-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;
                      font-family:var(--mono);font-size:10px;color:var(--ink-3);
                      background:none;border:none;padding:0;margin-bottom:8px;}
.thought-think-toggle:hover{color:var(--ink-2);}
.toggle-arrow{font-size:9px;transition:transform .15s;}
.toggle-arrow.open{transform:rotate(90deg);}
.thought-think{background:var(--bg-3);border:1px solid var(--border);border-left:3px solid var(--purple);
               padding:10px 12px;font-family:var(--mono);font-size:11px;color:var(--ink-3);
               line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-bottom:12px;
               border-radius:0 4px 4px 0;}
.thought-a{font-size:13px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.thought-a-label{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
                 color:var(--good);margin-bottom:6px;}

/* Empty / loading */
.empty{padding:48px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-3);}
.loading-dot::after{content:"…";animation:ldots 1.5s steps(4,end) infinite;}
@keyframes ldots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* Refresh bar */
.refresh-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;
             padding:10px 16px;background:var(--bg-2);border:1px solid var(--border);}
.refresh-label{font-family:var(--mono);font-size:10px;color:var(--ink-3);}
.refresh-btn{background:var(--bg-3);border:1px solid var(--border);color:var(--ink-2);
             font-family:var(--mono);font-size:10px;padding:4px 12px;cursor:pointer;border-radius:3px;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--good);animation:pulse 2s infinite;flex-shrink:0;}
.live-dot.bad{background:var(--bad);animation:none;}
@keyframes pulse{50%{opacity:.3;}}
.ml-auto{margin-left:auto;}

/* Pagination */
.pagination{display:flex;gap:8px;justify-content:center;margin-top:24px;}
.page-btn{background:var(--bg-2);border:1px solid var(--border);color:var(--ink-2);
          font-family:var(--mono);font-size:11px;padding:6px 14px;cursor:pointer;border-radius:4px;}
.page-btn:hover{border-color:var(--accent);color:var(--accent);}
.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.page-btn:disabled{opacity:.4;cursor:default;}

@media(max-width:760px){
  .stats-bar{gap:16px;}
  .search-bar{flex-wrap:wrap;}
  .model-filter,.search-btn{width:100%;}
}
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function(){var s=localStorage.getItem('ic-rpc');if(s&&window.location.origin!=='null'&&!s.startsWith(window.location.origin))localStorage.removeItem('ic-rpc');})();
  </script>
  <script type="text/babel" src="memory.jsx?v=20260530"></script>
</body>
</html>
