<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>InferenceChain Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>
:root {
  --bg:      #0b0a09;
  --bg-2:    #111009;
  --bg-3:    #181612;
  --bg-4:    #201e19;
  --border:  #252218;
  --border-2:#302c22;
  --ink:     #f0ece5;
  --ink-2:   #b0a898;
  --ink-3:   #6a6055;
  --accent:  #d4712a;
  --accent-2:#e8894a;
  --good:    #4ab87a;
  --warn:    #e8aa4a;
  --bad:     #e05a45;
  --blue:    #5a9cf0;
  --mono:    "JetBrains Mono", monospace;
  --sans:    "Inter", -apple-system, sans-serif;
  --serif:   "Instrument Serif", serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;}a:hover{color:var(--accent-2);}
code{font-family:var(--mono);font-size:.9em;}

/* ── Nav ─────────────────────────────────────────────────── */
.nav{background:var(--bg-2);border-bottom:1px solid var(--border);
     position:sticky;top:0;z-index:50;padding:0 24px;}
.nav-inner{max-width:1280px;margin:0 auto;height:56px;
           display:flex;align-items:center;gap:0;}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:-.01em;
       display:flex;align-items:center;gap:10px;margin-right:32px;}
.diamond{width:12px;height:12px;background:var(--accent);transform:rotate(45deg);flex-shrink:0;}
.nav-tag{font-family:var(--mono);font-size:9px;color:var(--ink-3);
         background:var(--bg-3);border:1px solid var(--border);
         padding:2px 7px;border-radius:3px;letter-spacing:.1em;}
.search-bar{flex:1;max-width:560px;position:relative;}
.search-input{width:100%;background:var(--bg-3);border:1px solid var(--border);
              color:var(--ink);font-family:var(--mono);font-size:12px;
              padding:9px 40px 9px 14px;border-radius:6px;}
.search-input:focus{outline:none;border-color:var(--accent);}
.search-input::placeholder{color:var(--ink-3);}
.search-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);
            background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:14px;}
.nav-links{display:flex;gap:20px;margin-left:28px;}
.nav-links a{font-size:13px;color:var(--ink-2);font-weight:500;}
.nav-links a:hover{color:var(--accent);}

/* ── Layout ──────────────────────────────────────────────── */
.page{max-width:1280px;margin:0 auto;padding:28px 24px;}

/* ── Stats strip ─────────────────────────────────────────── */
.stats-strip{display:grid;grid-template-columns:repeat(6,1fr);
             gap:0;border:1px solid var(--border);
             background:var(--bg-2);margin-bottom:28px;}
.stat-cell{padding:18px 20px;border-right:1px solid var(--border);}
.stat-cell:last-child{border-right:0;}
.stat-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
            text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;}
.stat-value{font-family:var(--serif);font-size:26px;letter-spacing:-.01em;line-height:1;}
.stat-unit{font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-left:4px;}
.stat-delta{font-family:var(--mono);font-size:10px;color:var(--good);margin-top:4px;}

/* ── Two-col home ────────────────────────────────────────── */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}

/* ── Cards / panels ──────────────────────────────────────── */
.panel{background:var(--bg-2);border:1px solid var(--border);overflow:hidden;}
.panel-head{display:flex;justify-content:space-between;align-items:center;
            padding:14px 18px;border-bottom:1px solid var(--border);}
.panel-title{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
             text-transform:uppercase;color:var(--ink-3);}
.panel-more{font-family:var(--mono);font-size:10px;color:var(--accent);}

/* ── Tables ──────────────────────────────────────────────── */
.data-table{width:100%;border-collapse:collapse;}
.data-table th{font-family:var(--mono);font-size:9px;letter-spacing:.12em;
               text-transform:uppercase;color:var(--ink-3);
               padding:10px 16px;border-bottom:1px solid var(--border);
               text-align:left;font-weight:500;}
.data-table td{padding:11px 16px;border-bottom:1px solid var(--border);
               font-size:13px;vertical-align:middle;}
.data-table tr:last-child td{border-bottom:0;}
.data-table tr:hover td{background:var(--bg-3);}
.hash{font-family:var(--mono);font-size:11px;}
.age {font-family:var(--mono);font-size:11px;color:var(--ink-3);}

/* ── Badges ──────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;
       font-family:var(--mono);font-size:9px;padding:2px 7px;
       border-radius:3px;font-weight:600;letter-spacing:.04em;}
.badge-complete{background:rgba(74,184,122,.12);color:var(--good);}
.badge-pending {background:rgba(232,170,74,.12);color:var(--warn);}
.badge-partial {background:rgba(90,156,240,.12);color:var(--blue);}
.badge-failed  {background:rgba(224,90,69,.12);color:var(--bad);}
.badge-block   {background:rgba(212,113,42,.12);color:var(--accent);}
.badge-tx      {background:rgba(145,145,145,.1);color:var(--ink-3);}

/* ── Detail pages ────────────────────────────────────────── */
.detail-head{margin-bottom:24px;}
.detail-title{font-family:var(--serif);font-size:28px;letter-spacing:-.01em;margin-bottom:6px;}
.detail-sub  {font-family:var(--mono);font-size:11px;color:var(--ink-3);}
.kv-grid{background:var(--bg-2);border:1px solid var(--border);}
.kv-row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid var(--border);}
.kv-row:last-child{border-bottom:0;}
.kv-key{padding:12px 18px;font-family:var(--mono);font-size:11px;
        color:var(--ink-3);letter-spacing:.04em;background:var(--bg-3);}
.kv-val{padding:12px 18px;font-family:var(--mono);font-size:12px;word-break:break-all;}

/* ── Pipeline (job detail) ───────────────────────────────── */
.job-pipe{display:grid;grid-template-columns:repeat(5,1fr);
          border:1px solid var(--border);margin:20px 0;}
.jp-step{padding:16px;border-right:1px solid var(--border);}
.jp-step:last-child{border-right:0;}
.jp-step.done .jp-dot{background:var(--good);}
.jp-step.active .jp-dot{background:var(--warn);animation:pulse 1s infinite;}
.jp-dot{width:7px;height:7px;border-radius:50%;background:var(--border-2);margin-bottom:8px;}
@keyframes pulse{50%{opacity:.35;}}
.jp-n   {font-family:var(--mono);font-size:9px;color:var(--ink-3);letter-spacing:.12em;margin-bottom:3px;}
.jp-name{font-size:12px;font-weight:600;margin-bottom:2px;}
.jp-sub {font-family:var(--mono);font-size:9px;color:var(--ink-3);}

/* ── Output box ──────────────────────────────────────────── */
.output-box{background:var(--bg-3);border:1px solid var(--border);
            border-left:3px solid var(--good);padding:16px 20px;
            font-size:14px;line-height:1.7;margin-top:16px;}
.output-label{font-family:var(--mono);font-size:9px;color:var(--good);
              letter-spacing:.14em;margin-bottom:8px;}

/* ── Address page ────────────────────────────────────────── */
.addr-hero{display:flex;gap:24px;margin-bottom:24px;flex-wrap:wrap;}
.addr-stat{background:var(--bg-2);border:1px solid var(--border);
           padding:18px 24px;min-width:160px;}
.addr-stat .stat-label{font-family:var(--mono);font-size:9px;color:var(--ink-3);
                        letter-spacing:.12em;margin-bottom:6px;}
.addr-stat .stat-value{font-family:var(--serif);font-size:24px;}

/* ── Empty / loading ─────────────────────────────────────── */
.empty{padding:40px;text-align:center;font-family:var(--mono);
       font-size:12px;color:var(--ink-3);}
.loading-dot::after{content:"…";animation:dots 1.5s steps(4,end) infinite;}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ── Breadcrumb ──────────────────────────────────────────── */
.crumb{font-family:var(--mono);font-size:11px;color:var(--ink-3);
       margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.crumb-sep{color:var(--border-2);}

/* ── Tab bar ─────────────────────────────────────────────── */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:0;}
.tab{padding:10px 18px;font-family:var(--mono);font-size:11px;cursor:pointer;
     color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab:hover{color:var(--ink-2);}

/* ── Pager ───────────────────────────────────────────────── */
.pager{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;
       border-top:1px solid var(--border);}
.pager-btn{background:var(--bg-3);border:1px solid var(--border);
           color:var(--ink-2);padding:5px 14px;font-family:var(--mono);
           font-size:11px;cursor:pointer;border-radius:4px;}
.pager-btn:hover{border-color:var(--accent);color:var(--accent);}
.pager-btn:disabled{opacity:.35;cursor:default;}
.pager-info{font-family:var(--mono);font-size:11px;color:var(--ink-3);
            display:flex;align-items:center;}

@media(max-width:960px){
  .stats-strip{grid-template-columns:repeat(3,1fr);}
  .home-grid{grid-template-columns:1fr;}
  .kv-row{grid-template-columns:1fr;}
  .job-pipe{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="explorer.jsx"></script>
</body>
</html>
